name: CD - Android Releases

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        default: debug
        options:
          - debug
          - staging
          - prod

permissions:
  contents: write

jobs:
  deploy:
    name: Build & Release Android App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.3'
          channel: stable
          cache: true

      - name: Install Dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Generate Code
        working-directory: frontend
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Resolve Version and Release Info
        id: release_info
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            RELEASE_NAME="Otune ${TAG_NAME}"
            IS_PRERELEASE="false"
            if [[ "$TAG_NAME" =~ - ]]; then
              IS_PRERELEASE="true"
            fi
            ENV_BUILD="prod"
          else
            RAW_VERSION=$(grep 'version:' frontend/pubspec.yaml | sed 's/version: //' | cut -d '+' -f 1 | tr -d '[:space:]')
            ENV_BUILD="${{ inputs.environment }}"
            TAG_NAME="v${RAW_VERSION}-${ENV_BUILD}"
            RELEASE_NAME="Otune v${RAW_VERSION} [${ENV_BUILD^^}]"
            
            if [ "$ENV_BUILD" != "prod" ]; then
              IS_PRERELEASE="true"
            else
              IS_PRERELEASE="false"
            fi
          fi

          CLEAN_VERSION=$(echo "$TAG_NAME" | sed 's/^v//' | cut -d '-' -f 1)

          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "release_name=${RELEASE_NAME}" >> $GITHUB_OUTPUT
          echo "is_prerelease=${IS_PRERELEASE}" >> $GITHUB_OUTPUT
          echo "env_build=${ENV_BUILD}" >> $GITHUB_OUTPUT
          echo "clean_version=${CLEAN_VERSION}" >> $GITHUB_OUTPUT

      - name: Decode Keystore
        if: steps.release_info.outputs.env_build != 'debug'
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > frontend/android/app/upload-keystore.jks

      - name: Build Application
        working-directory: frontend
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PATH: android/app/upload-keystore.jks
        run: |
          TARGET_ENV="${{ steps.release_info.outputs.env_build }}"
          VERSION_NAME="${{ steps.release_info.outputs.clean_version }}"
          BUILD_NUM="${{ github.run_number }}"

          if [ "$TARGET_ENV" = "debug" ]; then
            flutter build apk --debug --build-name=$VERSION_NAME --build-number=$BUILD_NUM
          elif [ "$TARGET_ENV" = "staging" ]; then
            flutter build apk --release --flavor staging --build-name=$VERSION_NAME --build-number=$BUILD_NUM
          elif [ "$TARGET_ENV" = "prod" ]; then
            flutter build apk --release --flavor prod --build-name=$VERSION_NAME --build-number=$BUILD_NUM
            flutter build appbundle --release --flavor prod --build-name=$VERSION_NAME --build-number=$BUILD_NUM
          fi

      - name: Clean Keystore
        if: always() && steps.release_info.outputs.env_build != 'debug'
        run: rm -f frontend/android/app/upload-keystore.jks

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release_info.outputs.tag_name }}
          name: ${{ steps.release_info.outputs.release_name }}
          prerelease: ${{ steps.release_info.outputs.is_prerelease == 'true' }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            frontend/build/app/outputs/flutter-apk/*.apk
            frontend/build/app/outputs/bundle/*/*.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}