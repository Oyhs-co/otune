name: CD - Android Releases

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - staging
          - prod

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get
        working-directory: frontend

      - name: Generate Code
        run: dart run build_runner build --delete-conflicting-outputs
        working-directory: frontend

      - name: Build APK
        run: |
          if [ "${{ github.event.inputs.environment }}" == "debug" ]; then
            flutter build apk --debug
          elif [ "${{ github.event.inputs.environment }}" == "staging" ]; then
            flutter build apk --release --flavor staging
          else
            flutter build apk --release --flavor prod
          fi
        working-directory: frontend
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PATH: upload-keystore.jks

      - name: Decode Keystore (for Release/Staging)
        if: github.event.inputs.environment != 'debug'
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > frontend/android/app/upload-keystore.jks

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: otune-apk-${{ github.event.inputs.environment }}
          path: frontend/build/app/outputs/flutter-apk/*.apk
